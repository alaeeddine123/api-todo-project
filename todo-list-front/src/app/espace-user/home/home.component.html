<div class="app-container">
  <!-- Toolbar/Header -->
  <mat-toolbar color="primary" class="app-toolbar">
    <button mat-icon-button (click)="isSidenavOpen = !isSidenavOpen">
      <mat-icon>menu</mat-icon>
    </button>
    <span>🎯 M&A Analysis Platform</span>
    <span class="toolbar-spacer"></span>
    <div class="profile-section">
      <img [src]="user.avatar" [alt]="user.name" class="avatar">
      <div class="user-info">
        <span class="user-name">{{user.name}}</span>
        <span class="user-email">{{user.email}}</span>
        <span class="user-role">{{user.role}}</span>
      </div>
      <button mat-icon-button (click)="onLogout()" matTooltip="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <!-- Sidenav Container -->
  <mat-sidenav-container class="sidenav-container">
    <!-- Sidenav -->
    <mat-sidenav mode="side" [opened]="isSidenavOpen" class="sidenav">
      <div class="sidenav-content">

        <!-- Platform Logo/Brand -->
        <div class="sidenav-header">
          <div class="platform-brand">
            <mat-icon class="brand-icon">business_center</mat-icon>
            <span class="brand-text">M&A Hub</span>
          </div>
        </div>

        <!-- Main Navigation Menu -->
        <div class="menu-section">
          <div class="section-title">Navigation</div>
          <div class="menu-items">
            <a mat-list-item
               *ngFor="let item of getActiveMenuItems()"
               [routerLink]="item.route"
               routerLinkActive="active-link"
               [ngClass]="{'highlight-item': item.highlight}">
              <mat-icon class="menu-icon">{{item.icon}}</mat-icon>
              <span class="menu-text">{{item.text}}</span>
            </a>
          </div>
        </div>

        <!-- Quick Stats Section (Optional) -->
        <div class="menu-section quick-stats" *ngIf="isSidenavOpen">
          <div class="section-title">Quick Stats</div>
          <div class="stats-container">
            <div class="stat-item">
              <span class="stat-label">Active Analyses</span>
              <span class="stat-value">4</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">This Week</span>
              <span class="stat-value">12</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Avg Score</span>
              <span class="stat-value">72.5</span>
            </div>
          </div>
        </div>

        <!-- Legacy Menu (Temporary - for transition) -->
        <div class="menu-section legacy-section" *ngIf="false"> <!-- Set to true to show legacy menu -->
          <div class="section-title">Legacy</div>
          <div class="menu-items">
            <a mat-list-item
               *ngFor="let item of legacyMenuItems"
               [routerLink]="item.route"
               routerLinkActive="active-link">
              <mat-icon class="menu-icon">{{item.icon}}</mat-icon>
              <span class="menu-text">{{item.text}}</span>
            </a>
          </div>
        </div>

      </div>
    </mat-sidenav>

    <!-- Main Content Area -->
    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
